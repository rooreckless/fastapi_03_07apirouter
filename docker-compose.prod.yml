# 本番環境用Docker Compose設定
services:
  fastapi:
    build:
      context: .
      dockerfile: ./fastapi/Dockerfile/local/Dockerfile
      args:
        INCLUDE_DEV: "false"
    container_name: fastapi-prod
    ports:
      - "8000:8000"
    env_file:
      - .envs/production/env_prod
    environment:
      # 本番環境用の追加設定
      ENVIRONMENT: "production"
      LOG_LEVEL: "info"
    depends_on:
      - postgres
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    
  postgres:
    build:
      context: .
      dockerfile: ./postgres/Dockerfile/local/Dockerfile
    container_name: postgres-prod
    ports:
      - "5432:5432"
    env_file:
      - .envs/production/env_prod
    volumes:
      - fastapi_prod_postgres_data:/var/lib/postgresql/data
      - ./fastapi/app/db/sqls:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi_user} -d ${POSTGRES_DB:-fastapi_db} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fastapi_prod_postgres_data:
