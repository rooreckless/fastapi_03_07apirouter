# 本番環境用Docker Compose設定
services:
  fastapi:
    build:
      context: .
      dockerfile: ./fastapi/Dockerfile/prod/Dockerfile
      args:
        INCLUDE_DEV: "false"
    container_name: fastapi-prod
    ports:
      - "8000:8000"
    env_file:
      - .envs/production/env_prod
    environment:
      # 本番環境用の追加設定
      ENVIRONMENT: "production"
      LOG_LEVEL: "info"
      WORKERS: "4"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
  postgres:
    build:
      context: .
      dockerfile: ./postgres/Dockerfile/prod/Dockerfile
    container_name: postgres-prod
    ports:
      - "5432:5432"
    env_file:
      - .envs/production/env_prod
    volumes:
      - fastapi_prod_postgres_data:/var/lib/postgresql/data
      - ./fastapi/app/db/sqls:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi_user} -d ${POSTGRES_DB:-fastapi_db} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fastapi_prod_postgres_data:
    driver: local

networks:
  default:
    name: fastapi_prod_network
